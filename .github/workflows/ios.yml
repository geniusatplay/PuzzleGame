# Builds Physics Chain for iPhone/iPad on GitHub's macOS runners, signs it with the studio's Apple account and uploads it
# to TestFlight (App Store Connect app "Physics Chain: 3D Puzzles", com.emeraldvortexgames.physicschain).
# Input: the Xcode project from Godot's iOS export, zipped and split into PhysicsChain-iOS.zip.part* (device slices
# only; the game repo's tools/pack_ios_for_ci.sh).
# Signing: each run makes a distribution certificate and App Store profile for itself with the App Store Connect API
# key (ci/asc_signing.py) and revokes/deletes them when it ends. Needs the repo secret ASC_KEY_P8 (the text of AuthKey_65B2KVSQGL.p8, kept in the owner's
# "Physics Chain Signing (private)" folder). Without it the build still runs, unsigned, as a check.
# Ads (Nov 27 2026): the game's AdMob add-on (admob/) finds Google's ad library at run time; the library itself
# (Google-Mobile-Ads-SDK, which brings Google's consent library UMP) is added here with CocoaPods, and the workspace is
# built instead of the bare project. Nov 28 2026: Firebase Analytics and Crashlytics too (the add-on's PCFirebase class
# starts them), and the minimum iOS version is 15.0 (Firebase needs it; Apple requires it from April 2027).
name: Build iPhone (TestFlight)

on:
  push:
    branches: [main]
    paths: ["PhysicsChain-iOS.zip.part*", ".github/workflows/ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TEAM_ID: HJ35B2NL93
  BUNDLE_ID: com.emeraldvortexgames.physicschain
  ASC_KEY_ID: 65B2KVSQGL
  ASC_ISSUER_ID: 530c1faa-a59e-4a14-a33a-8adaa953e2db

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Godot 4.7's iOS library is built against the iOS 26 SDK: use the newest Xcode 26 installed.
      - name: Pick Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Unpack the Xcode project
        run: |
          cat PhysicsChain-iOS.zip.part* > PhysicsChain-iOS.zip
          mkdir PhysicsChain-iOS && cd PhysicsChain-iOS && unzip -q ../PhysicsChain-iOS.zip
          ls -la
          # every upload needs a new build number
          PLIST=$(ls */*-Info.plist | head -1)
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_ENV"

      - name: Add Google Mobile Ads (CocoaPods)
        working-directory: PhysicsChain-iOS
        run: |
          cat > Podfile <<'POD'
          platform :ios, '15.0'
          # Firebase's Swift pods (Crashlytics, Sessions) need module maps when built as static libraries
          use_modular_headers!
          target 'PhysicsChain' do
            pod 'Google-Mobile-Ads-SDK', '~> 13.0'
            pod 'FirebaseAnalytics'
            pod 'FirebaseCrashlytics'
          end
          POD
          pod --version
          pod install --repo-update 2>&1 | tail -20
          ls -d *.xcworkspace
          # the game's own linker flags (GDExtension entry points) live on the project; CocoaPods' target settings
          # reach them through $(inherited)
          grep -n "OTHER_LDFLAGS" "Pods/Target Support Files/Pods-PhysicsChain/Pods-PhysicsChain.release.xcconfig"

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "SIGN=0" >> "$GITHUB_ENV"; echo "No ASC_KEY_P8 secret: unsigned check build only"; exit 0; fi
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "SIGN=1" >> "$GITHUB_ENV"

      # Apple's automatic signing needs a registered iPhone for its development profile, so each run makes its own
      # Apple Distribution certificate and App Store profile (ci/asc_signing.py) and removes both at the end.
      - name: Signing certificate and profile (for this run only)
        if: env.SIGN == '1'
        run: |
          set -e
          pip3 install --break-system-packages -q pyjwt cryptography requests 2>/dev/null || pip3 install -q pyjwt cryptography requests
          mkdir -p ~/signing && cd ~/signing
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout key.pem -out csr.pem -subj "/CN=Physics Chain CI/O=Emerald Vortex Games LLC/C=US" 2>/dev/null
          python3 "$GITHUB_WORKSPACE/ci/asc_signing.py" create csr.pem . "$BUNDLE_ID" "$GITHUB_RUN_ID"
          /usr/bin/openssl x509 -inform DER -in cert.cer -out cert.pem
          P12PASS=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -out cert.p12 -passout pass:$P12PASS
          KC=$HOME/signing/ci.keychain-db
          KCPASS=$(/usr/bin/openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import cert.p12 -k "$KC" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          curl -fsSL -o wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import wwdr.cer -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          rm -f key.pem cert.p12
          UUID=$(python3 -c "import json;print(json.load(open('ids'))['profile_uuid'])")
          NAME=$(python3 -c "import json;print(json.load(open('ids'))['profile_name'])")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp profile.mobileprovision "$d/$UUID.mobileprovision"
          done
          echo "KC=$KC" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: env.SIGN == '1'
        working-directory: PhysicsChain-iOS
        run: |
          set -o pipefail
          # the app target signs by hand with this run's profile; CocoaPods' targets stay unsigned static libraries
          python3 - <<'PY'
          import os, re
          p = "PhysicsChain.xcodeproj/project.pbxproj"
          s = open(p).read()
          def fix(block):
              if "INFOPLIST_FILE" not in block:
                  return block
              block = re.sub(r'CODE_SIGN_IDENTITY = "[^"]*";', 'CODE_SIGN_IDENTITY = "Apple Distribution";', block)
              block = re.sub(r'CODE_SIGN_STYLE = "?Automatic"?;', 'CODE_SIGN_STYLE = Manual;', block)
              block = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', 'PROVISIONING_PROFILE_SPECIFIER = "%s";' % os.environ["PROFILE_NAME"], block)
              return block
          s = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", lambda m: fix(m.group(0)), s, flags=re.S)
          open(p, "w").write(s)
          print(s.count("CODE_SIGN_STYLE = Manual;"), "configurations set to manual signing")
          PY
          xcodebuild archive -workspace PhysicsChain.xcworkspace -scheme PhysicsChain -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -archivePath build/PhysicsChain.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            2>&1 | tee xcodebuild.log | tail -60

      - name: Upload to TestFlight
        if: env.SIGN == '1'
        working-directory: PhysicsChain-iOS
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/PhysicsChain.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID 2>&1 | tee export.log | tail -40
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log
          echo "Uploaded Physics Chain $VERSION ($BUILD) to App Store Connect: it shows in TestFlight after Apple processes it."

      - name: Build (unsigned check)
        if: env.SIGN != '1'
        working-directory: PhysicsChain-iOS
        run: |
          set -o pipefail
          xcodebuild build -workspace PhysicsChain.xcworkspace -scheme PhysicsChain -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | tail -60

      - name: Show the build errors
        if: failure()
        working-directory: PhysicsChain-iOS
        run: grep -nE "error:|fatal|Undefined symbol|No profiles|No signing" xcodebuild.log export.log 2>/dev/null | head -200 || true

      - name: Remove the key, certificate and profile
        if: always()
        run: |
          if [ -f ~/signing/ids ]; then python3 "$GITHUB_WORKSPACE/ci/asc_signing.py" cleanup ~/signing || true; fi
          [ -n "$KC" ] && security delete-keychain "$KC" 2>/dev/null || true
          rm -rf ~/private_keys ~/signing
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
