# Builds Physics Chain for iPhone/iPad on GitHub's macOS runners, signs it with the studio's Apple account and uploads it
# to TestFlight (App Store Connect app "Physics Chain: 3D Puzzles", com.emeraldvortexgames.physicschain).
# Input: the Xcode project from Godot's iOS export, zipped and split into PhysicsChain-iOS.zip.part* (device slices
# only; the game repo's tools/pack_ios_for_ci.sh).
# Signing is automatic: Xcode makes or reuses the distribution certificate and App Store profile with the App Store
# Connect API key. Needs the repo secret ASC_KEY_P8 (the text of AuthKey_65B2KVSQGL.p8, kept in the owner's
# "Physics Chain Signing (private)" folder). Without it the build still runs, unsigned, as a check.
# Ads (Nov 27 2026): the game's AdMob add-on (admob/) finds Google's ad library at run time; the library itself
# (Google-Mobile-Ads-SDK) is added here with CocoaPods, and the workspace is built instead of the bare project.
name: Build iPhone (TestFlight)

on:
  push:
    branches: [main]
    paths: ["PhysicsChain-iOS.zip.part*", ".github/workflows/ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TEAM_ID: HJ35B2NL93
  BUNDLE_ID: com.emeraldvortexgames.physicschain
  ASC_KEY_ID: 65B2KVSQGL
  ASC_ISSUER_ID: 530c1faa-a59e-4a14-a33a-8adaa953e2db

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Godot 4.7's iOS library is built against the iOS 26 SDK: use the newest Xcode 26 installed.
      - name: Pick Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Unpack the Xcode project
        run: |
          cat PhysicsChain-iOS.zip.part* > PhysicsChain-iOS.zip
          mkdir PhysicsChain-iOS && cd PhysicsChain-iOS && unzip -q ../PhysicsChain-iOS.zip
          ls -la
          # every upload needs a new build number
          PLIST=$(ls */*-Info.plist | head -1)
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_ENV"

      - name: Add Google Mobile Ads (CocoaPods)
        working-directory: PhysicsChain-iOS
        run: |
          cat > Podfile <<'POD'
          platform :ios, '14.0'
          target 'PhysicsChain' do
            pod 'Google-Mobile-Ads-SDK', '~> 13.0'
          end
          POD
          pod --version
          pod install --repo-update 2>&1 | tail -20
          ls -d *.xcworkspace
          # the game's own linker flags (GDExtension entry points) live on the project; CocoaPods' target settings
          # reach them through $(inherited)
          grep -n "OTHER_LDFLAGS" "Pods/Target Support Files/Pods-PhysicsChain/Pods-PhysicsChain.release.xcconfig"

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "SIGN=0" >> "$GITHUB_ENV"; echo "No ASC_KEY_P8 secret: unsigned check build only"; exit 0; fi
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "SIGN=1" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: env.SIGN == '1'
        working-directory: PhysicsChain-iOS
        run: |
          set -o pipefail
          xcodebuild archive -workspace PhysicsChain.xcworkspace -scheme PhysicsChain -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -archivePath build/PhysicsChain.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            CODE_SIGN_IDENTITY="Apple Development" "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" PROVISIONING_PROFILE="" \
            2>&1 | tee xcodebuild.log | tail -60

      - name: Upload to TestFlight
        if: env.SIGN == '1'
        working-directory: PhysicsChain-iOS
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/PhysicsChain.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID 2>&1 | tee export.log | tail -40
          echo "Uploaded Physics Chain $VERSION ($BUILD) to App Store Connect: it shows in TestFlight after Apple processes it."

      - name: Build (unsigned check)
        if: env.SIGN != '1'
        working-directory: PhysicsChain-iOS
        run: |
          set -o pipefail
          xcodebuild build -workspace PhysicsChain.xcworkspace -scheme PhysicsChain -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | tail -60

      - name: Show the build errors
        if: failure()
        working-directory: PhysicsChain-iOS
        run: grep -nE "error:|fatal|Undefined symbol|No profiles|No signing" xcodebuild.log export.log 2>/dev/null | head -200 || true

      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
